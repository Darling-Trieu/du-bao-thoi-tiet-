<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Thời Tiết Tuổi Thơ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@500;700;800&family=VT323&display=swap">
<style>
/* Layout: full-bleed broadcast stage. Map canvas fills the screen; title top-centre, date top-right,
   logo slot top-left left empty, weather card right (or below on portrait), ticker along the bottom. Single dark look. */
:root{
  --space:#1f78d1; --navy:#0d47a1; --navy-2:#1565c0;
  --gold:#ffd23a; --gold-2:#ff9d0a; --ink:#ffffff; --muted:#e3f0ff;
  --morning:#ffcf3a; --afternoon:#7fd3ff; --evening:#c3b0ff;
  --ticker:#ffe45c; --ticker-ink:#0a1a4a;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
  --f-osd:"VT323","Courier New",monospace;
  --tick-h:clamp(44px,8vh,96px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--space)}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}

/* top */
.logo-slot{position:absolute;z-index:6;left:max(24px,2vw,env(safe-area-inset-left,0px));top:calc(1.2vh + env(safe-area-inset-top,0px));
  height:clamp(76px,14.5vh,170px);aspect-ratio:592/440;border-radius:1.6vh;display:grid;place-items:center;background:#fff;padding:.9vh 1vh;box-sizing:content-box;box-shadow:0 4px 12px rgba(0,30,70,.25);
  border:2px dashed transparent;transition:border-color .2s,background .2s}
.logo-slot img{width:100%;height:100%;display:block;object-fit:contain;}
.logo-slot span{position:absolute;bottom:-26px;white-space:nowrap;font-size:clamp(12px,1.6vh,18px);font-weight:700;color:rgba(255,255,255,.75);opacity:0;transition:opacity .2s;text-align:center;padding:0 8px}
.logo-slot:hover span,.logo-slot:focus-visible span{opacity:1}
.logo-slot img{max-width:100%;max-height:100%;object-fit:contain}
.logo-slot.has-logo:hover span{opacity:0}

.title{position:absolute;z-index:5;left:50%;top:calc(1.6vh + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;width:max-content;max-width:56vw}
.title b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6.2vh,72px);letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#fff8c4 0%,var(--gold) 45%,var(--gold-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #2a1200) drop-shadow(0 0 2px #000)}
.title small{display:inline-block;margin-top:.6vh;font-size:clamp(12px,2.2vh,26px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,#1f6fe0,#0b3a9a);padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.date{position:absolute;z-index:5;right:max(24px,2vw,env(safe-area-inset-right,0px));top:calc(1.6vh + env(safe-area-inset-top,0px));text-align:right;font-family:var(--f-osd);line-height:.95;pointer-events:none;
  text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6)}
.date .d1{font-size:clamp(14px,2.8vh,32px);color:var(--gold);letter-spacing:.06em}
.date .d2{font-size:clamp(22px,5.4vh,62px);color:#fff}

/* weather card */
.card{position:absolute;z-index:5;right:max(24px,2vw,env(safe-area-inset-right,0px));top:17vh;bottom:calc(var(--tick-h) + 3.5vh);width:min(34vw,700px);
  display:flex;flex-direction:column;gap:3.2vh;padding:3.4vh 2.2vw;box-sizing:border-box;border-radius:1.6vh;
  background:linear-gradient(180deg,rgba(30,136,229,.94),rgba(21,101,192,.94));border:3px solid rgba(255,255,255,.85);
  box-shadow:0 14px 40px rgba(10,40,90,.35);
  opacity:0;transform:translateX(40px);transition:opacity .6s ease,transform .6s ease;overflow:hidden;min-width:0}
.card.show{opacity:1;transform:none}
.card.show.swap{opacity:.12;transition:opacity .45s ease}
.card.show:not(.swap){transition:opacity .6s ease,transform .6s ease}
.tabs{display:flex;gap:.6vw}
.tabs span{flex:1;text-align:center;font:800 clamp(12px,2.1vh,24px)/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;
  padding:1.2vh .3vw;border-radius:.9vh;color:rgba(255,255,255,.85);background:rgba(255,255,255,.16);transition:background .3s,color .3s}
.tabs span.on{color:var(--ticker-ink);background:var(--seg-c,var(--gold))}
[hidden]{display:none!important}
.start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,40,100,.45);backdrop-filter:blur(3px)}
.start-box{background:#fff;border-radius:3vh;padding:4vh 5vw;display:flex;flex-direction:column;align-items:center;gap:2.2vh;box-shadow:0 20px 50px rgba(0,30,70,.35)}
.start-title{font-family:var(--f-display);font-size:clamp(28px,6vh,70px);letter-spacing:.06em;color:#0d4fb0}
.start-btn{width:clamp(80px,15vh,170px);height:clamp(80px,15vh,170px);border-radius:50%;border:0;cursor:pointer;background:linear-gradient(180deg,#ffe066,#ffc928);box-shadow:0 8px 0 #d99a00,0 14px 24px rgba(0,30,70,.25);display:grid;place-items:center}
.start-btn svg{width:50%;height:50%;margin-left:8%}
.start-btn:focus-visible{outline:4px solid #1e88e5;outline-offset:6px}
.start-hint{font:700 clamp(14px,2.6vh,30px)/1.3 var(--f-body);color:#1b2b4a}
.start-music{font:600 clamp(12px,2vh,22px)/1.3 var(--f-body);color:#4a6491}
.pick-music{appearance:none;border:2px solid #1e88e5;background:#fff;color:#0d4fb0;font:800 clamp(13px,2.1vh,24px)/1 var(--f-body);padding:1.2vh 1.6vw;border-radius:999px;cursor:pointer}
.pick-music:focus-visible{outline:3px solid #ffc928;outline-offset:3px}
.yt-hold{position:absolute;left:-10000px;top:0;width:200px;height:113px;overflow:hidden}
.scene{position:absolute;inset:0;transform-origin:50% 50%}
.tflash{position:absolute;inset:0;z-index:5;pointer-events:none;background:#fff;opacity:0}
.card{justify-content:center;top:auto;bottom:calc(var(--tick-h) + 2.5vh);width:min(28vw,560px);min-height:0;max-height:46vh;gap:1.8vh;padding:2.6vh 1.8vw}
.seg-head{display:flex;align-items:center;gap:1.2vw;min-width:0}
.seg-head svg{width:clamp(48px,8.5vh,100px);height:clamp(48px,8.5vh,100px);flex:none;overflow:visible}
.big-temp{font-family:var(--f-display);font-size:clamp(30px,6.6vh,78px);line-height:1;color:#fff;white-space:nowrap;text-shadow:0 4px 0 rgba(0,30,80,.3)}
.landmark{position:absolute;z-index:6;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;will-change:transform}
.landmark::before{content:"";position:absolute;left:50%;top:45%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 65%);opacity:var(--glow,0);z-index:-1}
.landmark svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,30,70,.3))}
.landmark span{margin-top:.2em;font:800 1em/1 var(--f-body);letter-spacing:.06em;color:#0d2f6b;background:#ffd23a;padding:.35em .8em;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,30,70,.3)}
.replay{position:absolute;z-index:7;left:max(24px,2vw,env(safe-area-inset-left,0px));bottom:calc(var(--tick-h) + 2.2vh);width:clamp(40px,5.4vh,60px);height:clamp(40px,5.4vh,60px);
  border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(13,71,161,.55);display:grid;place-items:center;cursor:pointer;opacity:.75;transition:opacity .2s;padding:0}
.replay:hover,.replay:focus-visible{opacity:1;outline:none;box-shadow:0 0 0 3px #ffd23a}
.replay svg{width:55%;height:55%}
.seg-name{white-space:nowrap;font-family:var(--f-display);font-size:clamp(26px,5.2vh,62px);line-height:.95;letter-spacing:.04em;color:var(--seg-c,var(--gold));text-shadow:0 4px 0 rgba(0,0,0,.45)}
.hero{display:flex;align-items:center;gap:1.4vw}
.hero svg{width:clamp(70px,13vh,150px);height:clamp(70px,13vh,150px);flex:none;overflow:visible}
.range small{display:block;font-size:clamp(11px,1.8vh,20px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.range b{display:block;white-space:nowrap;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6.8vh,80px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #001640}
.say{margin:0;font-size:clamp(15px,3.3vh,38px);font-weight:700;line-height:1.38;color:#fff;min-height:3.9em}
.say .caret{display:inline-block;width:.5ch;background:var(--seg-c,var(--gold));margin-left:2px}
@keyframes blink{50%{opacity:0}}
.note{margin:auto 0 0;font-size:clamp(13px,2.2vh,26px);font-weight:600;line-height:1.45;color:var(--muted);border-top:2px solid rgba(255,255,255,.3);padding-top:12px}
.note b{color:var(--gold)}

/* ticker */
.ticker{position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(var(--tick-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
  background:linear-gradient(180deg,#0f4fb0,#0a3a8c);border-top:4px solid #ffd23a;box-shadow:0 -4px 14px rgba(0,30,80,.35);overflow:hidden;display:flex;align-items:stretch}
.ticker .lb{flex:none;display:flex;align-items:center;padding:0 1.6em 0 1.2em;font:800 calc(var(--tick-h) * .36)/1 var(--f-body);letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,#e53935,#c62828);position:relative;z-index:1;box-shadow:4px 0 10px rgba(0,0,0,.25)}
.ticker .track{position:relative;flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .run{display:flex;width:max-content;backface-visibility:hidden}
.ticker .run span{font:700 calc(var(--tick-h) * .44)/1 var(--f-body);letter-spacing:.02em;color:#fff;white-space:nowrap;padding-right:1.6em;-webkit-font-smoothing:antialiased}
.ticker .run span i{font-style:normal;color:#ffd23a;padding-left:1.6em}

/* retro screen texture (no TV frame) */
.scan{position:absolute;inset:0;z-index:7;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45) 100%)}

@media (max-aspect-ratio:11/10){
  .card{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(var(--tick-h) + 16px);max-height:42vh}
  .say{min-height:0}
  .hero svg{width:64px;height:64px}
  .seg-name{font-size:clamp(30px,8vw,48px)}
  .title{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;text-align:right;max-width:calc(100vw - 170px)}
  .title b{font-size:clamp(18px,5.6vw,34px);white-space:nowrap}
  .title small{font-size:10px;padding:3px 10px;letter-spacing:.1em}
  .date{top:calc(78px + env(safe-area-inset-top,0px))}
  .date .d1{font-size:13px}.date .d2{font-size:20px}
}
/* day card (header with day + date, white body with the period's weather) */
.card{top:auto;bottom:calc(var(--tick-h) + 2.5vh);right:max(24px,2vw,env(safe-area-inset-right,0px));width:min(22vw,440px);min-height:0;max-height:none;
  display:block;padding:0;gap:0;background:none;border:0;border-radius:2vh;box-shadow:0 14px 34px rgba(0,30,70,.35);overflow:hidden}
.c-head{background:linear-gradient(180deg,#2a8be6,#0d4fb0);border-bottom:.5vh solid #ffd23a;color:#fff;font:800 clamp(18px,3.6vh,42px)/1 var(--f-body);letter-spacing:.04em;text-align:center;padding:1.6vh 1vw 1.5vh;white-space:nowrap}
.c-body{position:relative;background:linear-gradient(180deg,#ffffff 0%,#eef2f7 100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:1vh;padding:2vh 1.3vw 2.8vh}
.c-body::after{content:"";position:absolute;right:0;bottom:0;width:3.4vh;height:3.4vh;background:linear-gradient(135deg,transparent 50%,#0d4fb0 50%)}
.c-body .seg-name{font-size:clamp(22px,4.4vh,52px);color:#0d2f6b;text-shadow:none;letter-spacing:.03em}
.c-body svg{width:clamp(70px,15vh,170px);height:clamp(70px,15vh,170px);overflow:visible}
.c-body .big-temp{display:flex;flex-direction:column;align-items:center;gap:.4vh;font-size:clamp(30px,7vh,80px);color:#1b2b4a;text-shadow:none}
.c-body .big-temp[hidden]{display:none}
.c-body .say{font-size:clamp(14px,2.7vh,32px);font-weight:700;line-height:1.35;color:#1b2b4a;min-height:0;margin:0}
.c-body .say .caret{background:#1e88e5}
</style>

  <div class="scene" id="scene">
  <canvas class="layer" id="map"></canvas>
  <canvas class="layer" id="fx"></canvas>
  <aside class="card" id="card" aria-live="polite">
    <div class="c-head" id="cHead">THỨ SÁU · 30/10</div>

  const sun = (cx, cy, r) => `<g transform="translate(${cx - 32} ${cy - 32})"><g style="transform-origin:32px 32px;animation:spin 14s linear infinite">${Array.from({ length: 12 }, (_, i) => `<path d="M32 ${32 - r - 3} l3 -7 l3 7z" transform="rotate(${i * 30} 32 32) translate(-3 0)" fill="#ffb21a" stroke="#a85400" stroke-width="1"/>`).join("")}</g><circle cx="32" cy="32" r="${r}" fill="url(#sg)" stroke="#b35a00" stroke-width="1.5"/></g>`;
  const cloud = (fill, dx = 0, dy = 0, s = 1) => `<g transform="translate(${dx} ${dy}) scale(${s})"><path d="M14 50 h36 a10 10 0 0 0 1-20 a14 14 0 0 0-27-4 a10 10 0 0 0-10 24z" fill="${fill}" stroke="#2a3a5c" stroke-width="1.6" stroke-linejoin="round"/></g>`;
  const drops = n => Array.from({ length: n }, (_, i) => `<path style="animation:drop .9s linear ${(i * .27).toFixed(2)}s infinite" d="M${20 + i * 9} 53 l-2 6" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round"/>`).join("");
  const defs = `<defs><radialGradient id="sg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#ffd52e"/><stop offset="1" stop-color="#ff8a00"/></radialGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9c9e0"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6bb"/><stop offset="1" stop-color="#4b5670"/></linearGradient><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6f8f"/><stop offset="1" stop-color="#2b2f4a"/></linearGradient></defs>`;
  if (type === "thermo") return `<rect x="26" y="4" width="12" height="42" rx="6" fill="#fff" stroke="#17325e" stroke-width="2.5"/><rect x="29.5" y="16" width="5" height="32" rx="2.5" fill="#e53935"/><circle cx="32" cy="51" r="9" fill="#e53935" stroke="#17325e" stroke-width="2.5"/><path d="M41 12h5M41 20h5M41 28h5M41 36h5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  if (type === "suncloud") return defs + sun(26, 24, 15) + cloud("url(#cg)", 10, 8, .85);

}
function showSeg(i) {
  seg = i; const s = SEG[i];
  document.documentElement.style.setProperty("--seg-c", s.color);
  $("segName").textContent = s.name; $("segIcon").innerHTML = icon(s.icon);
  $("bigTemp").hidden = !s.big;
  seedClouds(s); drops = []; bolts = []; flash = 0; nextBolt = performance.now() + 1200;
  clearInterval(typer); const el = $("say"); let n = reduce ? s.say.length : 0;
  const draw = () => { el.innerHTML = s.say.slice(0, n) + (n < s.say.length ? '<span class="caret">&nbsp;</span>' : ""); };
  draw(); typer = setInterval(() => { n += 1; draw(); if (n >= s.say.length) clearInterval(typer); }, 28);
}
let trans = null;
function goSeg(i) {
  if (seg < 0 || trans || i < 0 || i > 3 || i === seg) return;
  const sc = $("scene"), fl = $("tflash"), tOut = reduce ? 200 : 750, tIn = reduce ? 200 : 1050;
  const z = reduce ? 1.02 : 1.1, bl = reduce ? 0 : 10;
  fl.animate([{ opacity: 0 }, { opacity: .35, offset: tOut / (tOut + tIn) }, { opacity: 0 }], { duration: tOut + tIn, easing: "ease-in-out" });

  trans = [out];
  out.onfinish = () => {
    showSeg(i);
    const inn = sc.animate([{ transform: `scale(${z})`, filter: `blur(${bl}px)` }, { transform: "scale(1)", filter: "blur(0px)" }], { duration: tIn, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
    trans.push(inn);
    inn.onfinish = () => { trans.forEach(a => a.cancel()); trans = null; };
  };
}
const replay = () => { t0 = performance.now(); seg = -1; started = false; if (trans) { trans.forEach(a => a.cancel()); trans = null; } $("card").classList.remove("show", "swap"); clouds = []; drops = []; bolts = []; puffs = []; };
/* ---------- music: the theme file placed next to this page.
   Plays the opening (0 → ~26 s: fanfare over the globe and the map, bridge into TP.HCM),
   then keeps repeating the middle section (8 bars, 26.15 s → 61.055 s) for the periods. ---------- */
const MUSIC_FILES = ["nhac-ban-tin.m4a", "YTSave.to_YouTube_Media_H61Cxik8BOk_HQ-VTV-Nhạc-hiệu-Dự-báo-thời-tiết-2004-2019_005_128k.m4a"];
const LOOP_A = 26.15, LOOP_B = 61.055;
const audio = new Audio(); audio.preload = "auto";
let musicReady = false, pending = false, musicOn = false, fi = 0;
const mStat = $("musicStat");
function setMusicStat(t) { mStat.textContent = "Nhạc: " + t; }
audio.addEventListener("canplaythrough", () => { if (!musicReady) { musicReady = true; setMusicStat("sẵn sàng"); } });
audio.addEventListener("error", () => {
  if (fi >= MUSIC_FILES.length) { setMusicStat("không đọc được tệp nhạc này"); return; }
  fi++; if (fi < MUSIC_FILES.length) { audio.src = encodeURI(MUSIC_FILES[fi]); audio.load(); }
  else tryRemembered();
});
/* when the page is opened from the link (no music file next to it), the viewer can pick the file from their own computer;
   it stays on that computer (remembered in this browser only) and is never uploaded */
function useBlob(blob, name) { musicReady = false; fi = MUSIC_FILES.length; audio.src = URL.createObjectURL(blob); audio.load(); setMusicStat("đang mở " + (name || "tệp nhạc") + "…"); }
function idb(fn) { try { const r = indexedDB.open("ban-tin-nhac", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => fn(r.result); r.onerror = () => fn(null); } catch (_) { fn(null); } }
function tryRemembered() {
  $("pickMusic").hidden = false;
  idb(db => {
    if (!db) return setMusicStat("chưa có tệp nhạc – bấm “Chọn tệp nhạc trên máy”");
    try { const q = db.transaction("f").objectStore("f").get("music"); q.onsuccess = () => { const v = q.result; if (v && v.blob) useBlob(v.blob, v.name); else setMusicStat("chưa có tệp nhạc – bấm “Chọn tệp nhạc trên máy”"); }; q.onerror = () => setMusicStat("chưa có tệp nhạc – bấm “Chọn tệp nhạc trên máy”"); }
    catch (_) { setMusicStat("chưa có tệp nhạc – bấm “Chọn tệp nhạc trên máy”"); }
  });
}
$("pickMusic").onclick = () => $("musicFile").click();
$("musicFile").onchange = () => {
  const f = $("musicFile").files[0]; if (!f) return; useBlob(f, f.name);
  idb(db => { try { db && db.transaction("f", "readwrite").objectStore("f").put({ blob: f, name: f.name }, "music"); } catch (_) {} });
};
audio.src = encodeURI(MUSIC_FILES[0]); audio.load();
function begin(withMusic) { if (!pending) return; pending = false; musicOn = withMusic; t0 = performance.now(); running = true; }
function startShow() {
  $("start").hidden = true; pending = true;
  if (!musicReady) return begin(false);
  try { audio.pause(); audio.currentTime = 0; audio.volume = 1; } catch (_) {}
  const p = audio.play();
  if (p && p.then) p.then(() => begin(true)).catch(() => { setMusicStat("trình duyệt chặn phát nhạc"); begin(false); });
  else begin(true);
}
const VOL_INTRO = 1.2, VOL_LOOP = .60; // opening at full volume, the repeating middle section (from TP.HCM on) quieter
function music() {
  if (!musicOn) return;
  if (audio.currentTime >= LOOP_B) audio.currentTime -= (LOOP_B - LOOP_A); // repeat the middle section
  const target = audio.currentTime < LOOP_A ? VOL_INTRO : VOL_LOOP;
  const v = audio.volume + Math.max(-.01, Math.min(.01, target - audio.volume)); // glide so the drop isn't abrupt
  try { audio.volume = v; } catch (_) {}
}
$("startBtn").onclick = startShow;
$("replayBtn").onclick = () => { replay(); running = false; musicOn = false; startShow(); };
addEventListener("keydown", e => { if (e.key === "ArrowRight") goSeg(seg + 1); if (e.key === "ArrowLeft") goSeg(seg - 1); if (e.key === "r" || e.key === "R") { replay(); running = false; startShow(); }
  if ((e.key === "Enter" || e.key === " ") && !$("start").hidden) { e.preventDefault(); startShow(); } });
let sx = null, sy = null;
const stage = $("stage");
stage.addEventListener("pointerdown", e => { if (e.target.closest(".logo-slot,.replay,.start")) return; sx = e.clientX; sy = e.clientY; });
stage.addEventListener("pointerup", e => {
  if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) goSeg(seg + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
});
stage.addEventListener("pointercancel", () => sx = null);

/* logo slot (saved in this browser only) */
/* logo: always the original Vanan Preschool logo, transparent background */

/* date + ticker */
const DOW = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"], p2 = n => String(n).padStart(2, "0");
const now0 = new Date(2026, 9, 30); /* tạm thời cố định ngày 30/10 */ $("cHead").textContent = `${DOW[now0.getDay()].toUpperCase()} · ${p2(now0.getDate())}/${p2(now0.getMonth() + 1)}`;
const unit = '<span>PHÁT THANH VIÊN: MINH THẢO • MINH ĐĂNG • MINH ANH • MINH KHÔI<i>★</i></span>'; const run = $("run"); run.innerHTML = unit.repeat(4);
/* crawl moved in whole device pixels each frame so the text stays sharp (no blur/shimmer) */
let tx = 0, tLast = performance.now();
function crawl(now) {
  const dt = Math.min(.05, (now - tLast) / 1000); tLast = now;
  const half = run.scrollWidth / 2, dpr = devicePixelRatio || 1, speed = Math.max(70, innerHeight * .1) * (reduce ? .4 : 1);
  tx -= speed * dt; if (half > 0 && -tx >= half) tx += half;
  run.style.transform = `translate3d(${Math.round(tx * dpr) / dpr}px,0,0)`;
  requestAnimationFrame(crawl);
}
requestAnimationFrame(crawl);

/* ---------- main loop ---------- */
const SUBS = ["Bản tin hôm nay", "Việt Nam", "Thành phố Hồ Chí Minh"];
let lastSub = -1, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = running ? (now - t0) / 1000 : 0, C = camera(t);
  music(t);
  const sub = t < T1 ? 0 : t < T3 ? 1 : 2; if (sub !== lastSub) { $("sub").textContent = SUBS[sub]; lastSub = sub; }
  // base map (cached once the camera rests on HCMC)
  if (t >= T4) {
    if (!cacheOK) { drawMap(cctx, C); cacheOK = true; }
    mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.drawImage(cache, 0, 0);
    proj.rotate([-C.c[0], -C.c[1]]).scale(C.s).translate(C.t);
  } else drawMap(mctx, C);

  if (seg >= 0) { const [c0, c1] = SKY[seg], gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, W, H); }

    g.globalAlpha = c.a; g.drawImage(c.img, c.x, c.y, c.w, c.w * .62);

  labelsHCM(g, t < T3 + 3.0 ? 0 : Math.min(1, (t - T3 - 3.0) / .6));

    while (drops.length < want) drops.push({ x: R.x + Math.random() * (R.w + 80), y: R.y + Math.random() * R.h * -.2 + Math.random() * R.h, v: 700 + Math.random() * 500, l: 12 + Math.random() * 14 });
    g.strokeStyle = seg === 2 ? "rgba(170,190,255,.55)" : "rgba(200,225,255,.6)"; g.lineWidth = 1.3; g.beginPath();
    for (const d of drops) { d.y += d.v * dt; d.x -= d.v * dt * .18; if (d.y > R.y + R.h) { d.y = R.y - 20; d.x = R.x + Math.random() * (R.w + 80); } g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .18, d.y - d.l); }
    g.stroke();

  else if (t > T3 && t < T4) drawFly(g, (t - T3) / T.z2);

  requestAnimationFrame(frame);
}
sprites(); layout();
addEventListener("resize", () => { layout(); if (seg >= 0) seedClouds(SEG[seg]); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { cacheOK = false; });
requestAnimationFrame(frame);
})();
</script>
